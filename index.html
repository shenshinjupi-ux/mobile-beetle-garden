<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行動甲蟲館</title><style>
:root{--ink:#24372c;--moss:#365a3e;--cream:#f7f3e7;--card:#fffdf6;--line:#e8e0cd;--gold:#d99d32;--bad:#c65d50}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 6% 0,#dcebcf,transparent 35%),var(--cream);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.wrap{max-width:1110px;margin:auto;padding:24px 18px 54px}.top,.hero,.head,.subhead{display:flex;justify-content:space-between;align-items:center}.top{margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:15px;background:var(--moss);display:grid;place-items:center;font-size:25px}.brand b{font-size:19px;letter-spacing:.08em}.brand small{display:block;color:#778378;font-size:10px;letter-spacing:.13em;margin-top:2px}.reset{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:11px;color:var(--moss);font-weight:700;cursor:pointer}.hero{align-items:end;gap:16px;margin-bottom:18px}.hero h1{font-size:clamp(26px,5vw,40px);margin:3px 0 6px;letter-spacing:.04em}.hero p{margin:0;color:#707b71;font-size:14px}.eyebrow{color:#74935a;font-size:11px;font-weight:900;letter-spacing:.16em}.day,.tag{border:1px solid #eddcb3;background:#fff9e9;color:#7a6030;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px #33432c10}.main,.pad{padding:18px}.head{margin-bottom:13px}.head h2{font-size:15px;margin:0}.tag{padding:5px 8px;color:#687968;background:white;border-color:var(--line);font-size:11px}.terrarium{height:282px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(#e3efdb 0 46%,#a2b37a 46% 54%,#756447 54%)}.terrarium:after{content:"";position:absolute;inset:12px;border:2px solid #ffffff94;border-radius:15px}.plant{position:absolute;font-size:32px;z-index:1}.p1{left:7%;top:24%}.p2{right:8%;top:30%;font-size:25px}.p3{left:18%;bottom:11%;font-size:27px}.soil{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:55px;opacity:.65}.creature{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:95px;z-index:2;filter:drop-shadow(0 12px 8px #283b263b);animation:bob 2.5s ease-in-out infinite}.creature.adult{font-size:112px;top:45%;animation:glow 2.7s ease-in-out infinite}.stage{position:absolute;left:15px;top:15px;background:#fffdf6db;border-radius:9px;padding:6px 10px;font-weight:800;color:#486642;font-size:11px;z-index:2}.hint{position:absolute;right:15px;bottom:13px;color:white;text-shadow:0 1px 3px #35432f;font-size:11px;z-index:2}@keyframes bob{50%{transform:translate(-50%,-57%) rotate(-3deg)}}@keyframes glow{50%{transform:translate(-50%,-56%) rotate(2deg);filter:drop-shadow(0 0 15px #ffe58c)}}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.meter{background:#f4f2e8;border-radius:13px;padding:10px}.meter div{font-size:11px;font-weight:800;display:flex;justify-content:space-between}.meter b{color:var(--moss)}.track,.progress{height:8px;border-radius:9px;background:#e4e2d7;margin-top:7px;overflow:hidden}.fill,.progress i{display:block;height:100%;background:linear-gradient(90deg,#88a76a,#c7c96f);border-radius:9px;transition:.3s}.fill.low{background:linear-gradient(90deg,#e1a04b,#ca6559)}.side{display:flex;flex-direction:column;gap:14px}.name{font-size:22px;font-weight:900;margin:5px 0 2px}.species{font-size:12px;color:#768074}.subhead{font-size:11px;color:#758070;margin-top:16px}.status{margin-top:13px;padding:10px 11px;background:#f5f5e9;border-radius:11px;color:#647264;font-size:12px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:83px;border:1px solid var(--line);border-radius:13px;background:#fffefa;padding:10px;text-align:left;color:var(--ink);cursor:pointer}.action:hover{border-color:#9eb683;background:#fafbef}.action:disabled{opacity:.42;cursor:not-allowed}.action span{font-size:19px}.action b{font-size:12px;display:block;margin:4px 0}.action small{color:#7b857c;font-size:10px;line-height:1.35;display:block}.next{width:100%;border:0;border-radius:13px;margin-top:10px;padding:13px;background:var(--moss);color:white;font-weight:900;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.log{font-size:12px;color:#657167;line-height:1.6;max-height:126px;overflow:auto}.log p{margin:0 0 7px}.collection{display:flex;flex-wrap:wrap;gap:7px}.badge{background:#faf2d7;border:1px solid #eddb9d;color:#775a24;border-radius:9px;padding:7px 9px;font-size:11px}.empty{font-size:12px;color:#80887d;line-height:1.6}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#263b2b;color:white;padding:11px 16px;border-radius:10px;font-size:13px;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.cover{position:fixed;inset:0;background:#172217cc;display:grid;place-items:center;padding:17px;z-index:6}.modal{max-width:620px;width:100%;background:var(--card);border-radius:21px;padding:23px;box-shadow:0 20px 70px #10181077}.modal h2{margin:0 0 8px;font-size:22px}.modal p{font-size:13px;color:#637064;line-height:1.7;margin:0 0 15px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:1px solid var(--line);background:white;border-radius:14px;padding:12px 9px;cursor:pointer;color:var(--ink)}.choice:hover{border-color:#95ad79;background:#fafcf3}.choice span{font-size:31px}.choice b{display:block;font-size:13px;margin:5px 0}.choice small{font-size:10px;color:#788176;line-height:1.4}.primary{border:0;border-radius:12px;padding:12px 16px;background:var(--moss);color:white;font-weight:800;cursor:pointer;width:100%}@media(max-width:730px){.wrap{padding:16px 13px 35px}.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.top{margin-bottom:21px}.terrarium{height:235px}.choices{grid-template-columns:1fr}.choice{display:flex;gap:12px;text-align:left;align-items:center}.choice b{margin:0 0 3px}.day{align-self:flex-start}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">🪲</div><div><b>行動甲蟲館</b><small>MOBILE BEETLE GARDEN</small></div></div><button class="reset" id="reset">重新飼養</button></header><section class="hero"><div><div class="eyebrow">RAISE · OBSERVE · DISCOVER</div><h1>一隻厲害的甲蟲，從耐心開始。</h1><p>找出屬於你的飼育節奏，讓幼蟲平安羽化。</p></div><div class="day" id="day">飼育第 1 天</div></section><div class="grid"><section class="card main"><div class="head"><h2>🌿 飼養箱</h2><span class="tag" id="envTag">等待幼蟲入住</span></div><div class="terrarium"><div class="stage" id="stage">幼蟲期</div><span class="plant p1">🍃</span><span class="plant p2">🌱</span><span class="plant p3">🍂</span><span class="soil">🌿</span><div class="creature" id="creature">🐛</div><span class="hint" id="hint">觀察環境，建立自己的照護習慣</span></div><div class="meters"><div class="meter"><div><span>🍄 食物</span><b id="foodN">--</b></div><div class="track"><i class="fill" id="foodB"></i></div></div><div class="meter"><div><span>💧 環境</span><b id="envN">--</b></div><div class="track"><i class="fill" id="envB"></i></div></div><div class="meter"><div><span>💚 健康</span><b id="healthN">--</b></div><div class="track"><i class="fill" id="healthB"></i></div></div></div></section><aside class="side"><section class="card pad"><div class="head"><h2>我的甲蟲</h2><span class="tag" id="phase">準備中</span></div><div class="name" id="name">小栗</div><div class="species" id="species">請選擇一隻幼蟲</div><div class="subhead"><span id="growthTitle">羽化進度</span><span id="growthN">0 / 100</span></div><div class="progress"><i id="growthB"></i></div><div class="status" id="status">每種幼蟲的需求不同。飼養紀錄會讓你慢慢摸清牠的習性。</div></section><section class="card pad"><div class="head"><h2 id="careTitle">今日照護</h2><span class="tag" id="careTag">幼蟲期</span></div><div class="actions" id="actions"></div><button class="next" id="next">🌙 結束今天</button></section><section class="card pad"><div class="head"><h2>📖 飼育日誌</h2><span class="tag">最新紀錄</span></div><div class="log" id="log"></div></section><section class="card pad"><div class="head"><h2>🏅 成蟲圖鑑</h2><span class="tag" id="count">0 隻</span></div><div id="collection" class="empty">羽化成功的甲蟲會收藏在這裡。</div></section></aside></div></main><div class="toast" id="toast"></div><div id="modal"></div><script>
(()=>{const K='mobile-beetle-garden-v2',B={stag:{n:'台灣大鍬形蟲',t:'鍬形蟲',i:7,d:'黑亮的大顎，是森林裡安靜的王者。'},rhino:{n:'獨角仙',t:'兜蟲',i:5,d:'力氣十足，頭角十分有氣勢。'},rainbow:{n:'彩虹鍬形蟲',t:'鍬形蟲',i:6,d:'閃耀虹彩光澤的夢幻甲蟲。'}};const $=x=>document.getElementById(x);let s,t;const base=()=>({day:1,name:'小栗',kind:null,phase:'larva',food:78,env:76,health:86,growth:0,stress:0,last:0,logs:['飼育筆記已準備好。選擇幼蟲後，就能開始培育。'],collection:[]});function load(){try{return JSON.parse(localStorage.getItem(K))||base()}catch{return base()}}function save(){localStorage.setItem(K,JSON.stringify(s))}function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(x){s.logs.unshift(`第 ${s.day} 天｜${x}`);s.logs=s.logs.slice(0,9)}function pop(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(t);t=setTimeout(()=>$('toast').classList.remove('show'),2300)}function m(k,v){$(k+'N').textContent=v+'%';$(k+'B').style.width=v+'%';$(k+'B').classList.toggle('low',v<33)}function render(){let b=s.kind&&B[s.kind];$('day').textContent=`飼育第 ${s.day} 天`;$('name').textContent=s.name;$('species').textContent=b?`${b.n}・${b.t}`:'請選擇一隻幼蟲';$('phase').textContent=s.phase==='adult'?'成蟲期':s.phase==='dead'?'飼育結束':'幼蟲期';$('creature').textContent=s.phase==='adult'?'🪲':s.phase==='dead'?'🍂':'🐛';$('creature').className='creature '+(s.phase==='adult'?'adult':'');$('stage').textContent=s.phase==='adult'?'成蟲期・羽化成功':s.phase==='dead'?'飼育結束':'幼蟲期・正在成長';$('growthTitle').textContent=s.phase==='adult'?'成蟲體型':'羽化進度';$('growthN').textContent=s.phase==='adult'?`${s.size} mm・${s.grade}`:`${s.growth} / 100`;$('growthB').style.width=(s.phase==='adult'?100:s.growth)+'%';m('food',s.food);m('env',s.env);m('health',s.health);$('envTag').textContent=s.phase==='adult'?'成蟲活動中':s.phase==='dead'?'需要重新開始':'培育箱觀察中';$('hint').textContent=s.phase==='adult'?'果凍與乾淨的飼養箱，讓牠精神飽滿':s.phase==='dead'?'每一次飼養都是新的發現':s.day-s.last>8?'食物與環境似乎開始不夠新鮮了…':'幼蟲在安靜的環境中成長';$('status').textContent=s.phase==='adult'?`你的${b.n}已羽化。體型由幼蟲期的食物、健康與受驚程度決定。`:s.phase==='dead'?'幼蟲沒有撐過這次飼養。下次可試著調整更換的節奏。':s.kind?'菌瓶或木屑該多久更換一次呢？系統不會提示答案；觀察日誌與結果，慢慢找出牠的步調。':'每種甲蟲的飼養需求都不同。';$('log').innerHTML=s.logs.map(x=>`<p>• ${e(x)}</p>`).join('');$('count').textContent=`${s.collection.length} 隻`;$('collection').className=s.collection.length?'collection':'empty';$('collection').innerHTML=s.collection.length?s.collection.map(x=>`<span class="badge">${e(x.n)} ${x.z}mm・${e(x.g)}</span>`).join(''):'羽化成功的甲蟲會收藏在這裡。';actions();save()}function actions(){let a=s.phase==='larva'?[['change','🫙','更換菌瓶／木屑','重設食物與環境'],['observe','🔍','觀察幼蟲','記錄今天的狀態']]:s.phase==='adult'?[['jelly','🍮','餵食昆蟲果凍','補充體力與健康'],['clean','🧹','清理飼養箱','保持環境舒適']]:[];$('careTitle').textContent=s.phase==='adult'?'成蟲照護':'今日照護';$('careTag').textContent=s.phase==='adult'?'成蟲期':s.phase==='dead'?'已結束':'幼蟲期';$('actions').innerHTML=a.map(x=>`<button class="action" data-a="${x[0]}" ${!s.kind?'disabled':''}><span>${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a));$('next').disabled=!s.kind||s.phase==='dead';$('next').textContent=s.phase==='adult'?'🌙 迎接明天':'🌙 結束今天'}function act(a){if(a==='change'){let g=s.day-s.last;if(s.last&&g<=2){s.stress=Math.min(100,s.stress+18);s.health=Math.max(0,s.health-5);add('剛換過不久又更換耗材，幼蟲受到不少打擾。');pop('更換太頻繁，幼蟲有些緊張。')}else{s.food=100;s.env=96;s.last=s.day;s.stress=Math.max(0,s.stress-6);add('換上全新的菌瓶／木屑，環境變得乾淨新鮮。');pop('已更換耗材。')}}if(a==='observe'){add(s.day-s.last>7?'幼蟲活動變少，菌瓶／木屑似乎有些疲乏。':'幼蟲蜷在介質裡，看起來正在穩定進食。');pop('已記錄今日狀態。')}if(a==='jelly'){s.food=Math.min(100,s.food+26);s.health=Math.min(100,s.health+5);add('成蟲享用了香甜的昆蟲果凍。');pop('果凍吃得很乾淨！')}if(a==='clean'){s.env=Math.min(100,s.env+20);s.health=Math.min(100,s.health+8);add('你清理了飼養箱，成蟲住得更舒適。');pop('飼養箱煥然一新。')}render()}function next(){if(s.phase==='adult'){s.day++;s.food=Math.max(0,s.food-13);s.env=Math.max(0,s.env-8);s.health=Math.max(0,s.health-(s.food<25||s.env<25?8:-1));add(s.health<30?'成蟲顯得有些疲累，該多照顧牠了。':'成蟲平靜地度過了一天。');render();return}let b=B[s.kind];s.day++;let g=s.day-s.last,gain=4;s.food=Math.max(0,s.food-10);s.env=Math.max(0,s.env-8);if(g>b.i+3){s.food=Math.max(0,s.food-12);s.env=Math.max(0,s.env-12);s.health=Math.max(0,s.health-12);gain=0;add('耗材長時間沒有更換，環境惡化，幼蟲健康明顯下降。')}else if(g<b.i-2&&s.last){s.stress=Math.min(100,s.stress+5);gain=2;add('環境還很新，幼蟲需要時間重新適應。')}else{if(s.food>48&&s.env>42&&s.health>45){gain+=5;s.health=Math.min(100,s.health+2)}add('幼蟲在介質深處安穩地成長。')}if(s.food<22||s.env<18)s.health=Math.max(0,s.health-10);s.growth=Math.min(100,s.growth+gain);if(s.health<=0){s.phase='dead';add('幼蟲沒有撐過這次飼養。下次可從狀態推敲更換時機。');pop('飼育結束。把經驗留給下一隻幼蟲吧。')}else if(s.growth>=100)hatch();render()}function hatch(){let b=B[s.kind];s.phase='adult';let score=Math.round(s.health*.58+(100-s.stress)*.42);s.size=Math.round(42+score*.25+(Math.random()*4-2));s.grade=s.size>=63?'S 傳說級':s.size>=57?'A 優秀':s.size>=51?'B 穩定':'C 初次羽化';s.collection.unshift({n:b.n,z:s.size,g:s.grade});add(`羽化成功！${s.name}成為${b.n}，體型 ${s.size} mm，獲得 ${s.grade}。`);show(`<h2>✨ 羽化成功！</h2><p>${e(s.name)}蛻變成帥氣的<b>${e(b.n)}</b>！<br>最終體型：<b>${s.size} mm</b><br>飼育評分：<b>${s.grade}</b><br><br>再養一隻，用不同節奏挑戰更大的體型吧。</p><button class="primary" id="close">去照顧成蟲</button>`);$('close').onclick=()=>$('modal').innerHTML=''}function show(x){$('modal').innerHTML=`<div class="cover"><div class="modal">${x}</div></div>`}function choose(){show(`<h2>選擇一隻幼蟲 🐛</h2><p>不同品種的飼育節奏各有差異。系統不會告訴你最佳更換時機，請靠觀察與多次挑戰累積心得。</p><div class="choices">${Object.entries(B).map(([k,b])=>`<button class="choice" data-k="${k}"><span>🪲</span><span><b>${b.n}</b><small>${b.d}</small></span></button>`).join('')}</div>`);document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{s.kind=x.dataset.k;s.last=s.day;add(`你帶回了${B[s.kind].n}幼蟲，新的飼育挑戰開始。`);$('modal').innerHTML='';render();pop('小夥伴入住了！')})}$('next').onclick=next;$('reset').onclick=()=>{let c=s.collection;s=base();s.collection=c;render();choose()};s=load();render();if(!s.kind)choose()})();
</script></body></html>
